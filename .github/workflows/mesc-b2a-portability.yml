name: MESC B2A Portability

# Synthetic cross-platform portability validation for the private P01-04B2A
# canonical-serialization increment (FD-PV-1..10, FC-PV-1..8).
#
# A pull_request run is INFRASTRUCTURE VALIDATION ONLY. It proves the harness
# and the cross-runner comparison work. It is NOT admissible portability
# evidence, it does not close the Windows or macOS obligation, it does not
# accept B2A, and it does not authorize B2B.
#
# Only a separately authorized workflow_dispatch run against an exact canonical
# main SHA may produce evidence admissible for a B2A acceptance decision.

on:
  pull_request:
    paths:
      - '.github/workflows/mesc-b2a-portability.yml'
      - 'tests/_mesc_b2a_portability.py'
      - 'tests/test_mesc_b2a_portability.py'
      - 'src/medscale/mesc/_canonical_json_v1.py'
      - 'src/medscale/mesc/_split_artifacts_v1.py'
      - 'tests/test_mesc_canonical_json_v1.py'
      - 'tests/test_mesc_split_artifacts_v1.py'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact canonical main commit SHA this run must execute against'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mesc-b2a-portability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: portability (${{ matrix.cell }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
            cell: linux-py3.11
          - os: ubuntu-latest
            python-version: '3.12'
            cell: linux-py3.12
          - os: windows-latest
            python-version: '3.11'
            cell: windows-py3.11
          - os: windows-latest
            python-version: '3.12'
            cell: windows-py3.12
          - os: macos-latest
            python-version: '3.11'
            cell: macos-py3.11
          - os: macos-latest
            python-version: '3.12'
            cell: macos-py3.12
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Guard canonical-main dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "dispatch rejected: ref ${GITHUB_REF} is not refs/heads/main"; exit 1
          fi
          head="$(git rev-parse HEAD)"
          if [ "${head}" != "${EXPECTED_SHA}" ]; then
            echo "dispatch rejected: HEAD ${head} != expected_sha ${EXPECTED_SHA}"; exit 1
          fi
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}

      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.14'
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: Verify uv runtime identity
        shell: bash
        run: |
          set -euo pipefail
          uv --version
          uv --version | grep -qx 'uv 0.11.14'
          echo "action-reported uv-version: ${UV_VERSION_OUTPUT}"
        env:
          UV_VERSION_OUTPUT: ${{ steps.setup-uv.outputs.uv-version }}

      - name: Sync (locked)
        shell: bash
        run: uv sync --frozen

      - name: Generate canonical artifacts
        shell: bash
        run: uv run python tests/_mesc_b2a_portability.py generate --out artifact

      - name: Verify exactly three files exist
        shell: bash
        run: |
          set -euo pipefail
          for name in canonical.json canonical.jsonl manifest.json; do
            test -f "artifact/${name}" || { echo "missing artifact/${name}"; exit 1; }
          done
          count="$(ls -1 artifact | wc -l | tr -d '[:space:]')"
          if [ "${count}" != "3" ]; then echo "expected 3 files, found ${count}"; exit 1; fi

      - name: Upload cell artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: b2a-portability-${{ matrix.cell }}
          path: artifact/
          retention-days: 14
          if-no-files-found: error

  aggregate:
    name: aggregate verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: generate
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Guard canonical-main dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "dispatch rejected: ref ${GITHUB_REF} is not refs/heads/main"; exit 1
          fi
          head="$(git rev-parse HEAD)"
          if [ "${head}" != "${EXPECTED_SHA}" ]; then
            echo "dispatch rejected: HEAD ${head} != expected_sha ${EXPECTED_SHA}"; exit 1
          fi
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}

      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.14'
          python-version: '3.12'
          enable-cache: false

      - name: Verify uv runtime identity
        shell: bash
        run: |
          set -euo pipefail
          uv --version
          uv --version | grep -qx 'uv 0.11.14'
          echo "action-reported uv-version: ${UV_VERSION_OUTPUT}"
        env:
          UV_VERSION_OUTPUT: ${{ steps.setup-uv.outputs.uv-version }}

      - name: Sync (locked)
        shell: bash
        run: uv sync --frozen

      - name: Download the six cell artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: b2a-portability-*
          path: downloaded

      - name: Verify artifact cardinality
        shell: bash
        run: |
          set -euo pipefail
          count="$(ls -1 downloaded | wc -l | tr -d '[:space:]')"
          if [ "${count}" != "6" ]; then echo "expected 6 artifacts, found ${count}"; exit 1; fi

      - name: Aggregate and compare all six cells
        shell: bash
        run: |
          set -euo pipefail
          uv run python tests/_mesc_b2a_portability.py aggregate \
            --root downloaded \
            --evidence-out evidence/portability-evidence.json

      - name: Publish non-admissible envelope to the job summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### B2A portability envelope'
            echo
            echo 'Infrastructure-validation output only.'
            echo 'NOT admissible portability evidence. Does NOT accept B2A.'
            echo 'Windows and macOS obligations remain open. B2B remains unauthorized.'
            echo
            echo '```json'
            cat evidence/portability-evidence.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          cat evidence/portability-evidence.json

      # Only a separately authorized canonical-main dispatch may retain the
      # envelope as an artifact. Pull-request runs never upload a seventh
      # artifact.
      - name: Upload evidence envelope (canonical-main dispatch only)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: b2a-portability-evidence
          path: evidence/portability-evidence.json
          retention-days: 14
          if-no-files-found: error
