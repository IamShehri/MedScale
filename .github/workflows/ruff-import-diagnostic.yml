name: Ruff Import Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - run: uv sync --frozen
      - run: >-
          uv run ruff check --select I001 --diff
          tests/test_mesc_bt_executor_core_fixture_v1.py
